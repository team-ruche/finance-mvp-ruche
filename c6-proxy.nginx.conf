# ============================================================================
#  Proxy mTLS para a API C6 Bank (BaaS)  —  Ruche Digital
#  O n8n chama ESTE proxy em texto puro; o proxy apresenta o certificado
#  cliente (.crt/.key) ao C6 via TLS mútuo (mTLS) e encaminha a resposta.
#  Assim o certificado fica no servidor, fora do n8n.
#
#  Validado por fora em 22/09/2026: mTLS OK, /auth 200, escopo statement.read.
#
#  INSTALAÇÃO (no servidor, como root):
#   1) Copie o certificado para um diretório só do nginx (NÃO versionar):
#        sudo mkdir -p /etc/nginx/c6
#        sudo cp "crt - Cristiano Sabatke" /etc/nginx/c6/client.crt
#        sudo cp "key - Cristiano Sabatke" /etc/nginx/c6/client.key
#        sudo chown root:root /etc/nginx/c6/client.*   && sudo chmod 600 /etc/nginx/c6/client.key
#   2) Copie este arquivo:
#        sudo cp c6-proxy.nginx.conf /etc/nginx/conf.d/c6-proxy.conf
#   3) Teste e recarregue:
#        sudo nginx -t && sudo systemctl reload nginx
#   4) No n8n, defina a variável de ambiente:
#        C6_BASE = http://127.0.0.1:8686/v1        (ver nota Docker abaixo)
#
#  DOCKER: se o n8n roda em container, ele NÃO enxerga 127.0.0.1 do host.
#   - troque `listen 127.0.0.1:8686;` por `listen 172.17.0.1:8686;`
#     (172.17.0.1 = gateway padrão do Docker; confirme com `ip addr show docker0`)
#   - e use  C6_BASE = http://172.17.0.1:8686/v1
#     (ou publique o proxy numa rede docker e use o nome do serviço)
#
#  PRODUÇÃO: duplique este server block trocando o upstream para
#   https://baas-api.c6bank.info e o certificado para o de produção
#   (gerado no web-banking, CNPJ da Ruche). Sugestão: porta 8687 e
#   C6_BASE_PROD = http://127.0.0.1:8687/v1
# ============================================================================

server {
    # Somente local / rede interna — NÃO exponha esta porta publicamente.
    listen 127.0.0.1:8686;
    server_name _;

    # Trava extra: só aceita origem interna (localhost + redes docker/privadas).
    allow 127.0.0.1;
    allow 172.16.0.0/12;   # redes docker
    allow 10.0.0.0/8;      # rede privada (ajuste/retire se não usar)
    deny  all;

    # Logs próprios (ajuda a depurar; sem corpo/credenciais).
    access_log /var/log/nginx/c6-proxy.access.log;
    error_log  /var/log/nginx/c6-proxy.error.log;

    # Não deixa o corpo do /auth (credenciais) aparecer em buffers temporários.
    proxy_request_buffering off;

    location / {
        # ---- destino: SANDBOX do C6 ----
        proxy_pass https://baas-api-sandbox.c6bank.info;

        # SNI + Host corretos para o C6
        proxy_ssl_server_name on;
        proxy_ssl_name        baas-api-sandbox.c6bank.info;
        proxy_set_header      Host baas-api-sandbox.c6bank.info;

        # >>> CERTIFICADO CLIENTE (mTLS) apresentado ao C6 <<<
        proxy_ssl_certificate     /etc/nginx/c6/client.crt;
        proxy_ssl_certificate_key /etc/nginx/c6/client.key;

        # Valida o certificado do servidor do C6 (recomendado).
        # Se der erro de verificação no 1º teste, troque para `off` e reporte.
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols           TLSv1.2 TLSv1.3;

        # Repasse do content-type (form-urlencoded no /auth, etc.)
        proxy_pass_request_headers on;
    }
}
